<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniBot - General AI Chatbot</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="bot-info">
        <div class="avatar-ring">
          <div class="bot-avatar">🤖</div>
          <span class="status-indicator online"></span>
        </div>
        <div>
          <h2>OmniBot Assistant</h2>
          <p class="status-text">General Purpose AI Chatbot | CI Pipeline Verified</p>
        </div>
      </div>
      <div class="pipeline-badge">
        <span class="badge-icon">⚙️</span> Jenkins Build #<span id="build-num">1</span>
      </div>
    </header>

    <!-- Chat Messages Window -->
    <main class="chat-messages" id="chat-messages">
      <div class="message bot-message">
        <div class="msg-avatar">🤖</div>
        <div class="msg-content">
          <p>Hello! I am <strong>OmniBot</strong>, your General Purpose AI Chatbot Assistant.</p>
          <p>You can ask me questions, check the time, calculate math, ask tech FAQs, or try one of the quick options below!</p>
          <span class="timestamp">Just now</span>
        </div>
      </div>
    </main>

    <!-- Quick Action Chips -->
    <div class="quick-chips">
      <button class="chip" onclick="sendQuickMessage('Hello!')">👋 Greeting</button>
      <button class="chip" onclick="sendQuickMessage('What time is it?')">⏰ Current Time</button>
      <button class="chip" onclick="sendQuickMessage('calculate 50 * 12')">🧮 Math: 50 * 12</button>
      <button class="chip" onclick="sendQuickMessage('Tell me about Jenkins pipeline')">⚙️ Jenkins CI</button>
      <button class="chip" onclick="sendQuickMessage('How does Docker work?')">🐳 Docker Info</button>
      <button class="chip" onclick="sendQuickMessage('What can you do?')">❓ Help & Info</button>
    </div>

    <!-- Input Box -->
    <footer class="chat-footer">
      <form id="chat-form">
        <input 
          type="text" 
          id="user-input" 
          placeholder="Ask OmniBot anything..." 
          autocomplete="off" 
          required 
        />
        <button type="submit" id="send-btn">
          <span>Send</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </form>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
